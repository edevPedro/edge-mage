tasks:
- id: softsum
  type: numeric
  prompt: 'Softmax de qualquer vetor: soma das probabilidades?'
  xp: 14
  answer: 1
  tolerance: 0.001
- id: ce
  type: mcq
  prompt: 'Com label one-hot na classe k, CE simplifica para:'
  xp: 18
  answer: 0
  choices:
  - −log p_k
  - p_k²
  - max z
  - ‖W‖
- id: fused
  type: mcq
  prompt: 'torch.nn.CrossEntropyLoss espera tipicamente:'
  xp: 18
  answer: 1
  choices:
  - probabilidades já normalizadas pelo softmax
  - logits crus (aplica log-softmax internamente)
  - apenas int8
  - só vetores de tamanho 2
- id: stable
  type: fill
  prompt: 'Antes do exp no softmax estável, subtraímos o ___ dos logits:'
  xp: 14
  answers:
  - max
  - máximo
  - maximo
  - maximum
- id: softmax-code
  type: code
  prompt: 'Implemente softmax(zs) estável (subtraia max).

    Imprima a soma de softmax([1.0, 2.0, 3.0]) arredondada a 6 casas: round(sum(...),
    6)

    '
  xp: 30
  expected_stdout: '1.0'
  code_template: "import math\n\ndef softmax(zs):\n    # TODO: retorne lista de\
    \ probabilidades\n    ...\n\nprint(round(sum(softmax([1.0, 2.0, 3.0])), 6))\n"
- id: code-softmax-stable
  type: code
  prompt: Implemente `softmax(zs)` estável (subtrai max) → lista de probs.
  xp: 28
  code_template: "import math\n\ndef softmax(zs):\n    # TODO\n    ...\n"
  code_tests: 'import math

    p=mod.softmax([1000.0,1000.0,1000.0])

    assert abs(sum(p)-1)<1e-9

    assert all(abs(x-1/3)<1e-6 for x in p)

    p2=mod.softmax([1.0,2.0,3.0])

    assert abs(sum(p2)-1)<1e-9 and p2[2]>p2[1]>p2[0]

    '
