id: simd-latency
requires_skills:
  - memory-layout
  - flops-bandwidth
title: SIMD & Latência
summary: NEON/Helium, lanes int8 e tradeoffs de acurácia vs latência.
xp_reward: 48
unlock_xp: 2600
resources:
  - title: Arm Neon Intrinsics Reference
    url: https://developer.arm.com/architectures/instruction-sets/intrinsics/
    kind: docs
  - title: Arm Architecture Reference Manual for A-profile (DDI0487)
    url: https://developer.arm.com/documentation/ddi0487/latest
    kind: docs
  - title: CMSIS-NN — MVE / DSP kernel selection
    url: https://arm-software.github.io/CMSIS-NN/latest/
    kind: docs
  - title: Arm Neoverse N1 Software Optimization Guide
    url: https://developer.arm.com/documentation/swog01195/latest
    kind: docs
animation: memory_grid
tasks:
  - id: simd
    type: fill
    prompt: 'Sigla para Single Instruction Multiple Data:'
    xp: 12
    answers:
      - simd
      - SIMD
  - id: trade
    type: mcq
    prompt: 'Reduzir latência on-device com quantização pode:'
    xp: 20
    answer: 1
    choices:
      - só melhorar acurácia sempre
      - trocar um pouco de acurácia por velocidade/energia
      - aumentar o tamanho do binário 100×
      - remover a necessidade de dataset
  - id: neon
    type: mcq
    prompt: 'Em Cortex-A/M com extensão vetorial ARM típica, você ouve falar de:'
    xp: 16
    answer: 0
    choices:
      - NEON / Helium (MVE)
      - somente CUDA cores
      - JavaScript SIMD.js obrigatório
      - FTP vector mode
  - id: lanes
    type: numeric
    prompt: 'Lanes int8 em um registrador NEON 128-bit?'
    xp: 14
    answer: 16
    tolerance: 0
  - id: code-throughput
    type: code
    prompt: Implemente `ideal_speedup(lanes)` = float(lanes) (modelo ingênuo).
    xp: 18
    code_template: "def ideal_speedup(lanes):\n    # TODO\n    ...\n"
    code_tests: 'assert mod.ideal_speedup(8)==8.0

      '
