id: simd-latency
requires_skills:
- memory-layout
- flops-bandwidth
title: SIMD & Latência
summary: Paralelismo de dados e tradeoffs de acurácia.
xp_reward: 45
unlock_xp: 2600
resources:
- title: Arm Neon Intrinsics
