id: batch-epoch
title: Batch & Epoch
summary: Mini-batch, epoch, forward/backward no edge.
xp_reward: 40
unlock_xp: 1400
resources:
- title: CS231n — Training tips
  url: https://cs231n.github.io/neural-networks-3/
  kind: docs
- title: PyTorch DataLoader docs
  url: https://pytorch.org/docs/stable/data.html
  kind: docs
animation: probability_bars
tasks:
- id: epoch
  type: fill
  prompt: 'Nome de uma passagem completa pelo dataset de treino:'
  xp: 18
  answers:
  - epoch
  - época
  - epoca
- id: minibatch
  type: mcq
  prompt: 'Mini-batch SGD atualiza parâmetros usando:'
  xp: 21
  answer: 1
  choices:
  - sempre o dataset inteiro
  - a média do gradiente em B exemplos
  - somente o bias
  - FFT do batch
- id: edge
  type: mcq
  prompt: 'Em dispositivos edge tipicamente se prioriza:'
  xp: 21
  answer: 1
  choices:
  - treino full-batch de GPT
  - inferência eficiente (às vezes fine-tune leve)
  - somente backprop na NPU
  - descartar o modelo
- id: code-batches
  type: code
  prompt: Implemente `n_batches(n, batch_size)` = ceil(n/batch_size).
  xp: 22
  code_template: "import math\n\ndef n_batches(n, batch_size):\n    # TODO\n    ...\n"
  code_tests: 'assert mod.n_batches(10,4)==3

    assert mod.n_batches(8,4)==2

    '
