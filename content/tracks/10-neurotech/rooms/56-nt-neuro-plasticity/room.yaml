resources:
- title: Wolpaw & Wolpaw BCI principles
  url: https://doi.org/10.1016/j.clinph.2012.01.010
  kind: paper
tasks:
- id: co
  type: mcq
  prompt: 'Em BCI online, co-adaptação significa:'
  xp: 12
  answer: 0
  choices:
  - usuário e decoder adaptam-se ao longo do tempo
  - só o FIR muda sozinho sem humano
  - IRB opcional
  - alias desejável
- id: iid
  type: fill
  prompt: 'Assumir trials ___ entre dias pode falhar quando o usuário aprende (uma palavra: independentes/iid).'
  xp: 10
  answers:
  - iid
  - independentes
  - independent
- id: train
  type: mcq
  prompt: 'Recalibrar / adaptar o decoder entre sessões é:'
  xp: 10
  answer: 1
  choices:
  - sempre fraude
  - prática comum e honesta quando documentada
  - proibido em synth
  - Mago Supremo automático
- id: code-hebb
  type: code
  prompt: Implemente `hebbian_update(w, pre, post, lr=0.01)` computando w + lr * pre * post.
  xp: 12
  code_template: "def hebbian_update(w, pre, post, lr=0.01):\n    ...\n"
  code_tests: '

    assert abs(mod.hebbian_update(0.5, 1.0, 2.0, 0.1) - 0.7) < 1e-5

    '
