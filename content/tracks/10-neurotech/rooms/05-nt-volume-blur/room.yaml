    blurred = mod.spatial_blur_1d([0.0, 100.0, 0.0])
    assert abs(blurred[1] - 50.0) < 1e-5
    assert abs(blurred[0] - 25.0) < 1e-5
    assert abs(blurred[2] - 25.0) < 1e-5

    # Finger representations separated by 1.0 cm in M1: unresolvable on scalp
    res1, ratio1, fwhm1 = mod.audit_spatial_resolution(1.0, 2.5)
    assert res1 is False
