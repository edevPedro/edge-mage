tasks:
- id: fish
  type: mcq
  prompt: 'Testar dezenas de bandas/canais e reportar só o p<0.05 sem correção é:'
  xp: 12
  answer: 0
  choices:
  - fishing / inflação de falso positivo
  - potência estatística ideal
  - requisito de OpenBCI
  - substituto de κ
- id: bonf
  type: numeric
  prompt: 'Bonferroni: α=0.05, m=10 testes. α'' = α/m = ?'
  xp: 12
  answer: 0.005
  tolerance: 0.0001
- id: power
  type: fill
  prompt: A probabilidade de rejeitar H0 quando H1 é verdadeira chama-se ___ (1−β).
  xp: 12
  answers:
  - potência
  - potencia
  - power
  - poder estatístico
  - poder estatistico
- id: code-cohens-d
  type: code
  prompt: 'Implemente `cohens_d(m1, s1, m2, s2)` calculando o tamanho de efeito de Cohen: (m1 - m2) / sqrt((s1^2 + s2^2)/2).'
  xp: 14
  code_template: "def cohens_d(m1, s1, m2, s2):\n    ...\n"
  code_tests: '

    d = mod.cohens_d(10.0, 2.0, 8.0, 2.0)

    assert abs(d - 1.0) < 1e-5

    '
