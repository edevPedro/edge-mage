tasks:
- id: redflag
  type: mcq
  prompt: 'Red flag comum em paper BCI fraco:'
  xp: 12
  answer: 0
  choices:
  - N pequeno + deep net + sem nested CV / possível vazamento
  - citar DOI
  - reportar limites
  - usar κ além de acurácia
- id: fiche
  type: fill
  prompt: Na ficha, a fonte deve incluir um ___ ou URL estável (doi.org/…).
  xp: 12
  answers:
  - DOI
  - doi
  - DOI/URL
  - doi.org
- id: claim
  type: mcq
  prompt: 'Claims de “ler pensamentos” / lie detection em BCI educacional devem ser:'
  xp: 12
  answer: 1
  choices:
  - aceitos sem crítica
  - rejeitados / tratados como overclaim
  - implementados em malware
  - exigidos no boss
