- id: code-ssvep-detect
  type: code
  prompt: Implemente `ssvep_detect(freqs, powers, target_freqs=[10.0, 12.0, 15.0])` identificando a frequência alvo com maior potência no espectro.
  xp: 16
  code_template: "def ssvep_detect(freqs, powers, target_freqs=[10.0, 12.0, 15.0]):\n    ...\n"
  code_tests: '

    f = [10.0, 12.0, 15.0]

    p = [2.0, 18.5, 3.0]

    assert mod.ssvep_detect(f, p, [10.0, 12.0, 15.0]) == 12.0

    '
