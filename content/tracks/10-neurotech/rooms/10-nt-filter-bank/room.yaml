id: nt-filter-bank
title: Banco de filtros EEG
summary: Passa-banda por ritmo, notch de linha, e potência como feature.
xp_reward: 32
unlock_xp: 0
owners:
- eletrica
phase: F6-dsp
requires_rooms:
- nt-rhythms
- nt-adc-bio
- nt-cs-harness
course: neurotech
resources:
- title: OpenBCI — Setting up for EEG
  url: https://docs.openbci.com/GettingStarted/Biosensing-Setups/EEGSetup/
  kind: docs
- title: Riemannian approaches in BCI (HAL PDF)
  url: https://inria.hal.science/hal-01394253/document
  kind: paper
- title: Ang et al. — Filter Bank Common Spatial Pattern (FBCSP) IEEE
  url: https://doi.org/10.1109/IJCNN.2008.4634130
  kind: paper
animation: filter_freq_response
emulator: synth_eeg_stream
tasks:
- id: why-bank
  type: mcq
  prompt: 'Um filter bank em MI tipicamente existe para:'
  xp: 10
  answer: 0
  choices:
  - isolar bandas (ex. mu/beta) antes de features/classificação
  - aumentar a tensão da rede elétrica
  - substituir o consentimento do sujeito
  - eliminar a necessidade de amostragem
- id: notch
  type: mcq
  prompt: 'Notch em 50/60 Hz serve sobretudo para:'
  xp: 10
  answer: 2
  choices:
  - criar ritmos gama artificiais
  - medir impedância óssea
  - atenuar interferência da rede elétrica
  - treinar redes sem dados
- id: nyquist-fill
  type: fill
  prompt: Com fs = 250 Hz, Nyquist limita conteúdo útil abaixo de ___ Hz.
  xp: 12
  answers:
  - 125
  - 125 Hz
  - 125.0
- id: band-mask
  type: code
  prompt: 'Implemente `band_mask(freqs, lo, hi)` retornando lista booleana (True se
    lo <= f < hi).

    '
  xp: 16
  code_template: "def band_mask(freqs, lo, hi):\n    # TODO\n    ...\n"
  code_tests: 'assert mod.band_mask([8, 10, 12, 20], 8, 12) == [True, True, False,
    False]

    assert mod.band_mask([0, 50, 60], 50, 61) == [False, True, True]

    '
order: 28
