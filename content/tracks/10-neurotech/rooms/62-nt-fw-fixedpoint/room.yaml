tasks:
- id: scale
  type: numeric
  prompt: Em Q15, 1.0 cheio mapeia tipicamente para? (inteiro)
  xp: 12
  answer: 32767
  tolerance: 0.1
- id: sat
  type: mcq
  prompt: 'Overflow em acumulador fixed-point sem saturação:'
  xp: 12
  answer: 0
  choices:
  - pode wrapear e corromper o sinal
  - aumenta CMRR
  - é exigido pelo Belmont
  - remove alias
- id: name
  type: fill
  prompt: Formato fracionário com 15 bits de fração chama-se ___.
  xp: 10
  answers:
  - Q15
  - q15
- id: code-q15-conv
  type: code
  prompt: Implemente `float_to_q15(x)` convertendo float em [-1.0, 1.0) para inteiro Q15 signed de 16 bits [-32768, 32767] com saturação.
  xp: 14
  code_template: "def float_to_q15(x):\n    ...\n"
  code_tests: '

    assert mod.float_to_q15(0.5) == 16384

    assert mod.float_to_q15(-1.0) == -32768

    assert mod.float_to_q15(1.5) == 32767

    '
