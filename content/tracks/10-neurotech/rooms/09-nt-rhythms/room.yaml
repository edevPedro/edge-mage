tasks:
- id: alpha-hz
  type: mcq
  prompt: 'Alfa no adulto tipicamente fica perto de:'
  xp: 8
  answer: 1
  choices:
  - 0.5–4 Hz
  - 8–12 Hz
  - 40–100 Hz só
  - exatamente 60 Hz (rede)
- id: mi-bands
  type: mcq
  prompt: 'Imagética motora em EEG de escalpo costuma olhar sobretudo:'
  xp: 10
  answer: 2
  choices:
  - só onda delta frontal
  - apenas ECG
  - ritmos mu/beta sensorimotores
  - raios X do crânio
- id: gamma-fill
  type: fill
  prompt: Ritmos mais rápidos que ~30 Hz costumam ser chamados de ___.
  xp: 10
  answers:
  - gama
  - gamma
  - γ
  - banda gama
  - banda gamma
- id: code-dominant-rhythm
  type: code
  prompt: Implemente `dominant_rhythm(powers_dict)` retornando o nome da banda (chave) com maior potência.
  xp: 12
  code_template: "def dominant_rhythm(powers_dict):\n    ...\n"
  code_tests: '

    p = {"delta": 4.0, "theta": 12.0, "alpha": 35.0, "beta": 15.0}

    assert mod.dominant_rhythm(p) == "alpha"

    '
order: 27
