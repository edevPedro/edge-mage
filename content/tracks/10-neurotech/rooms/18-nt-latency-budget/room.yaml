    answer: 2
    choices:
      - "κ vira 1"
      - "Nyquist sobe"
      - "há miss de latência / feedback atrasado"
      - "o crânio some"
  - id: sum
    type: numeric
    prompt: "Sense 12 ms + decide 25 ms + act 10 ms = quantos ms?"
    xp: 14
    answer: 47
    tolerance: 0.01
