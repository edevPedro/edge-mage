    ratio, pred = mod.berlin_erd_ratio(5.0, 20.0)

    assert ratio == 0.25 and pred == "right_hand"

    ratio2, pred2 = mod.berlin_erd_ratio(25.0, 10.0)

    assert ratio2 == 2.5 and pred2 == "left_hand"

