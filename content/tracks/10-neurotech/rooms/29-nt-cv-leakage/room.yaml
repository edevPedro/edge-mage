- id: code-leakage-audit
  type: code
  prompt: Implemente `audit_leakage_effect(X, y, train_idx, test_idx)` demonstrando a ilusão de acurácia inflada em dados de ruído puro gerada por vazamento de dados (seleção de features antes do split) vs uma pipeline honesta (split primeiro, seleção só no treino).
  xp: 20
  code_template: "def audit_leakage_effect(X, y, train_idx, test_idx):\n    # retorne (leaky_acc, honest_acc)\n    ...\n"
  code_tests: '

    import random

    random.seed(123)

    X_noise = [[random.gauss(0, 1) for _ in range(15)] for _ in range(40)]

    y_labels = [0]*20 + [1]*20

    tr_idx = list(range(30))

    te_idx = list(range(30, 40))


    leaky_acc, honest_acc = mod.audit_leakage_effect(X_noise, y_labels, tr_idx, te_idx)

    assert leaky_acc >= honest_acc

    assert 0.0 <= honest_acc <= 1.0

    '
