tasks:
- id: isr
  type: mcq
  prompt: 'Dentro da ISR de alta taxa de sample, o padrão correto é:'
  xp: 12
  answer: 0
  choices:
  - trabalho mínimo (flag/DMA) — decode pesado fora
  - treinar deep net completa
  - abrir IRB
  - calcular FEM
- id: dma
  type: fill
  prompt: Transferência ADC→memória sem CPU a cada sample usa ___.
  xp: 10
  answers:
  - DMA
  - dma
- id: jitter
  type: mcq
  prompt: 'ISR longa demais tipicamente causa:'
  xp: 12
  answer: 1
  choices:
  - melhor κ offline
  - jitter / atraso no sampling ou no loop
  - Nyquist maior
  - autovalor negativo
- id: code-dma-irq
  type: code
  prompt: Implemente `check_dma_irq(write_ptr, prev_ptr, half_size=512, full_size=1024)` detectando transições de meia transferência (HT) e transferência completa (TC).
  xp: 14
  code_template: "def check_dma_irq(write_ptr, prev_ptr, half_size=512, full_size=1024):\n    # retorne (ht_irq, tc_irq)\n    ...\n"
  code_tests: '

    ht, tc = mod.check_dma_irq(520, 500, 512, 1024)

    assert ht is True and tc is False

    ht2, tc2 = mod.check_dma_irq(10, 1020, 512, 1024)

    assert tc2 is True

    '
