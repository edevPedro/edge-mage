id: nt-rhythms
title: "Ritmos α/β/γ/µ"
summary: "Bandas clássicas e ligação com imagética motora — pedagogia, não clínica."
xp_reward: 28
unlock_xp: 0
owners:
  - neurociencia
phase: F3
requires_rooms:
  - nt-electrode-snr
course: neurotech
resources:
  - title: "EEG MI — Techniques and Challenges (PMC)"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6471241/"
    kind: paper
  - title: "MI-BCI comprehensive review (MDPI Sensors)"
    url: "https://www.mdpi.com/1424-8220/21/6/2173"
    kind: paper
animation: rhythm_bands
tasks:
  - id: alpha-hz
    type: mcq
    prompt: "Alfa no adulto tipicamente fica perto de:"
    xp: 8
    answer: 1
    choices:
      - "0.5–4 Hz"
      - "8–12 Hz"
      - "40–100 Hz só"
      - "exatamente 60 Hz (rede)"
  - id: mi-bands
    type: mcq
    prompt: "Imagética motora em EEG de escalpo costuma olhar sobretudo:"
    xp: 10
    answer: 2
    choices:
      - "só onda delta frontal"
      - "apenas ECG"
      - "ritmos mu/beta sensorimotores"
      - "raios X do crânio"
  - id: gamma-fill
    type: fill
    prompt: "Ritmos mais rápidos que ~30 Hz costumam ser chamados de ___."
    xp: 10
    answers:
      - gama
      - gamma
      - "γ"
      - "banda gama"
      - "banda gamma"
