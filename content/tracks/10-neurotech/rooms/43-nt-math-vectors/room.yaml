- id: dim
  type: mcq
  prompt: 'Uma epoch com 8 canais × 1 amostra por canal é naturalmente um vetor em:'
  xp: 10
  answer: 0
  choices:
  - R^8
  - R^2 sempre
  - espaço de funções clínicas
  - só inteiros
- id: dot
  type: numeric
  prompt: ⟨(1,2),(3,4)⟩ = ?
  xp: 12
  answer: 11
  tolerance: 0.01
- id: code
  type: code
  prompt: Implemente `dot(a,b)`, `l2(a)` e `normalize_spatial_filter(w)` que retorna
    o vetor normalizado w tal que ||w_norm||_2 == 1.0. Se ||w||_2 == 0, levante ValueError.
  xp: 14
  code_template: "def dot(a, b):\n    return sum(x * y for x, y in zip(a, b))\n\n\
    def l2(a):\n    return sum(x * x for x in a) ** 0.5\n\ndef normalize_spatial_filter(w):\n\
    \    # normaliza vetor de pesos espaciais pela norma euclidiana\n    ...\n"
  code_tests: "assert abs(mod.dot([1, 2], [3, 4]) - 11) < 1e-9\nassert abs(mod.l2([3,\
    \ 4]) - 5) < 1e-9\nwn = mod.normalize_spatial_filter([3.0, 4.0])\nassert abs(mod.l2(wn)\
    \ - 1.0) < 1e-7\nassert abs(wn[0] - 0.6) < 1e-7 and abs(wn[1] - 0.8) < 1e-7\n\
    try:\n    mod.normalize_spatial_filter([0.0, 0.0])\n    assert False, \"Deveria\
    \ levantar ValueError para norma zero\"\nexcept ValueError:\n    pass\n"
order: 3
