animation: mi_erds
tasks:
- id: struct
  type: mcq
  prompt: 'Estrutura típica de trial MI supervisionado inclui:'
  xp: 12
  answer: 0
  choices:
  - baseline → cue → imagery → rest/ITI
  - só UART contínuo sem eventos
  - stim invasivo sem consentimento
  - treinar no conjunto de teste
- id: balance
  type: fill
  prompt: Classes com contagens muito diferentes enviesam acurácia; prefere-se desenho
    ___ (ou métricas robustas).
  xp: 12
  answers:
  - balanceado
  - equilibrado
  - balanced
  - balanceado / equilibrado
- id: marker
  type: mcq
  prompt: 'Markers/eventos sincronizados ao stream servem para:'
  xp: 12
  answer: 1
  choices:
  - aumentar fs além de Nyquist
  - alinhar epochs ao cue/task na análise
  - substituir ética
  - remover artefatos automaticamente sempre
