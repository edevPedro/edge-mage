tasks:
- id: no-mindread
  type: mcq
  prompt: 'Neste curso, afirmar que BCI “lê pensamentos” é:'
  xp: 8
  answer: 2
  choices:
  - correto para EEG de escalpo
  - ok se tiver XP de Edge
  - overclaim — evitamos
  - obrigatório no portal
- id: consent
  type: mcq
  prompt: 'Antes de gravar EEG humano em lab eletivo, o passo ético mínimo é:

    '
  xp: 10
  answer: 1
  choices:
  - treinar o classificador primeiro
  - consentimento informado do sujeito
  - publicar no GitHub sem aviso
  - aumentar ganho do amp
- id: mvp-data
  type: fill
  prompt: 'O MVP deste círculo prefere dados ___ (ou datasets abertos citados).

    '
  xp: 8
  answers:
  - sintéticos
  - sinteticos
  - synthetic
  - synthetics
- id: dual-use
  type: mcq
  prompt: 'Alfabetização dual-use neste curso significa:'
  xp: 10
  answer: 0
  choices:
  - reconhecer que BCI pode ser mal usado, sem ensinar weaponização / vigilância não
    consentida
  - ensinar a construir armas neurais
  - ignorar ética se o κ for alto
  - hackear dispositivos clínicos
- id: belmont-beneficence
  type: fill
  prompt: 'No Belmont, o princípio que exige maximizar benefício e minimizar dano
    (e honestidade sobre incerteza) chama-se ___.

    '
  xp: 8
  answers:
  - beneficência
  - beneficencia
  - Beneficência
  - Beneficencia
  - beneficence
  - Beneficence
- id: overclaim-numeric
  type: numeric
  prompt: Um decoder 2-classes balanceado tem chance level de acurácia ≈ 0.50. Um
    pitch reporta 0.94 em N=4 trials sem CV. Quantos princípios Belmont tipicamente
    falham na comunicação (respeitar limites da evidência + não exagerar benefício),
    conte 1 ou 2 como inteiro mínimo esperado neste curso?
  xp: 8
  answer: 2
  tolerance: 0
order: 2
