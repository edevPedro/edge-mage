id: nt-app-hybrid-p300
title: Aplicação — P300 speller (paradigma publicado)
summary: Oddball/P300 literacy com DOI clássico — emulação educacional.
xp_reward: 36
unlock_xp: 0
owners:
- bci
- neurociencia
phase: F11-apps
pillar: applications
course: neurotech
resources:
- title: Farwell & Donchin 1988 P300 speller
  url: https://doi.org/10.1016/0013-4694(88)90149-6
  kind: paper
tasks:
- id: latency
  type: numeric
  prompt: P300 nomeia positividade cerca de quantos ms pós-estímulo? (número)
  xp: 12
  answer: 300
  tolerance: 50
- id: odd
  type: fill
  prompt: O paradigma com estímulo raro entre frequentes chama-se ___.
  xp: 10
  answers:
  - oddball
  - odd-ball
  - odd
- id: scope
  type: mcq
  prompt: 'Esta sala:'
  xp: 10
  answer: 0
  choices:
  - ensina paradigma publicado — sem claim clínico
  - diagnostica pacientes
  - ensina stim invasivo
  - remove Estuda
- id: code-p300-peak
  type: code
  prompt: Implemente `p300_peak(erp_signal, fs=250, start_ms=250, end_ms=450)` localizando o valor máximo de deflexão positiva no intervalo especificado.
  xp: 14
  code_template: "def p300_peak(erp_signal, fs=250, start_ms=250, end_ms=450):\n    ...\n"
  code_tests: '

    sig = [0.0] * 200

    sig[75] = 12.5

    assert abs(mod.p300_peak(sig, 250, 250, 450) - 12.5) < 1e-5

    '
order: 65
requires_rooms:
- nt-app-neurofeedback
