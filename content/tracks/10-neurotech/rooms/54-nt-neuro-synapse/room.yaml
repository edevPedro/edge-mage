id: nt-neuro-synapse
title: Neurociência — Sinapses e PSP
summary: EPSP/IPSP → correntes → ponte ao LFP.
xp_reward: 32
unlock_xp: 0
owners:
- neurociencia
phase: F4-neuro
pillar: neuroscience
course: neurotech
resources:
- title: Einevoll et al. LFP (PMC)
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3884846/
  kind: paper
tasks:
- id: psp
  type: mcq
  prompt: PSPs são tipicamente ___ que o potencial de ação.
  xp: 10
  answer: 0
  choices:
  - mais lentos / mais longos
  - mais curtos sempre que um bit
  - iguais a SSVEP
  - irrelevantes ao LFP
- id: eipsp
  type: fill
  prompt: EPSP = potencial pós-sináptico ___.
  xp: 10
  answers:
  - excitatório
  - excitatorio
  - excitatory
- id: lfp
  type: mcq
  prompt: 'Correntes sinápticas sincronizadas contribuem fortemente para:'
  xp: 12
  answer: 0
  choices:
  - LFP
  - somente Cloudflare
  - LLVM passes
  - Belmont
- id: code-synapse
  type: code
  prompt: 'Implemente `alpha_conductance(t, tau=0.005, g_peak=1.0)` computando a função alfa de condutância pós-sináptica: g_peak * (t / tau) * exp(1 - t / tau) para t >= 0.'
  xp: 14
  code_template: "def alpha_conductance(t, tau=0.005, g_peak=1.0):\n    ...\n"
  code_tests: '

    assert abs(mod.alpha_conductance(0.005, 0.005, 1.0) - 1.0) < 1e-5

    assert abs(mod.alpha_conductance(0.0, 0.005, 1.0)) < 1e-5

    '
order: 26
requires_rooms:
- nt-neuro-neuron-hh
