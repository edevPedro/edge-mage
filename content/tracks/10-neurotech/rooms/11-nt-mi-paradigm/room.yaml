id: nt-mi-paradigm
title: Imagética motora (paradigma)
summary: Classes, trials e ERD↓/ERS↑ — paradigma MI educacional.
xp_reward: 32
unlock_xp: 0
owners:
- bci
- neurociencia
phase: F3
requires_rooms:
- nt-filter-bank
- nt-rhythms
course: neurotech
resources:
- title: Padfield et al. EEG-MI (PMC)
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6471241/
  kind: paper
- title: Alzahab et al. MI-BCI (MDPI)
  url: https://www.mdpi.com/1424-8220/21/6/2173
  kind: paper
- title: Pfurtscheller & Neuper — Motor imagery activates primary sensorimotor area (review context)
  url: https://doi.org/10.1016/S1388-2457(97)00056-9
  kind: paper
- title: Neuper et al. — Imagery of motor actions (Clin Neurophysiol)
  url: https://doi.org/10.1016/j.clinph.2005.08.007
  kind: paper
animation: mi_erds
tasks:
- id: mi-is
  type: mcq
  prompt: 'Imagética motora em BCI educacional é:'
  xp: 10
  answer: 1
  choices:
  - cirurgia de implante
  - imaginar movimento sem necessariamente executá-lo
  - ECG de 12 derivações
  - treino de LLM
- id: erd
  type: mcq
  prompt: 'ERD/ERS na literatura de MI refere-se sobretudo a:'
  xp: 10
  answer: 0
  choices:
  - mudanças de potência em ritmos sensorimotores
  - exclusivamente artefato de piscar
  - frequência da rede
  - rank de Mago Supremo
- id: erd-dir
  type: mcq
  prompt: 'Na convenção deste curso, durante a imagética tipicamente espera-se:'
  xp: 10
  answer: 0
  choices:
  - ERD↓ (queda de potência µ/β) e depois possível ERS↑ (rebound)
  - apenas aumento contínuo de 60 Hz
  - spike único resolvido no escalpo
  - substituição do consentimento
- id: classes
  type: fill
  prompt: Em MI binário clássico, costuma-se contrastar esquerda vs ___.
  xp: 12
  answers:
  - direita
  - right
  - mão direita
  - direita (mão)
- id: laterality
  type: fill
  prompt: No sistema 10–20, o canal sensorimotor esquerdo clássico perto da mão é C___ (contralateral
    à mão direita).
  xp: 12
  answers:
  - '3'
  - C3
  - c3
- id: plasticity
  type: mcq
  prompt: 'Calibração e feedback em MI importam porque:'
  xp: 10
  answer: 1
  choices:
  - o crânio muda de condutividade a cada sample
  - plasticidade / adaptação do usuário e drift do sinal fazem o mapa feature→classe mudar com o tempo
  - κ offline garante online para sempre
  - ADC deixa de existir após o treino
order: 11
