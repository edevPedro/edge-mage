tasks:
- id: seed
  type: mcq
  prompt: 'Fixar seed nos testes de pipeline serve para:'
  xp: 10
  answer: 0
  choices:
  - reprodutibilidade
  - aumentar alias
  - remover ética
  - hack clínico
- id: assert
  type: fill
  prompt: Verificações automáticas no harness são ___ (asserts/testes).
  xp: 10
  answers:
  - asserts
  - testes
  - tests
  - assertions
- id: reg
  type: mcq
  prompt: 'Se um PR derruba κ toy no synth sem motivo:'
  xp: 12
  answer: 0
  choices:
  - o harness deve falhar (regressão)
  - ignorar e shipar
  - culpar o usuário
  - apagar DOI
- id: code-drop-detector
  type: code
  prompt: Implemente `detect_drops(seqs, max_seq=256)` contando pacotes perdidos a partir de uma lista de números de sequência.
  xp: 14
  code_template: "def detect_drops(seqs, max_seq=256):\n    ...\n"
  code_tests: '

    assert mod.detect_drops([0, 1, 2, 3]) == 0

    assert mod.detect_drops([0, 2, 3]) == 1

    assert mod.detect_drops([255, 1], max_seq=256) == 1

    '
