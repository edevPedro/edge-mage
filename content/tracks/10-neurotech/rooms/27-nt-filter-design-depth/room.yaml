  - não é causal em tempo real — use só offline / batch
  - remove a necessidade de ADC
  - garante κ=1
- id: delay
  type: numeric
  prompt: 'FIR ordem N=65, fs=250 Hz, fase linear.

    delay_s ≈ (N−1)/(2·fs) em segundos?

    '
  xp: 14
  answer: 0.128
  tolerance: 0.002
- id: iir
  type: fill
  prompt: Filtros ___ são eficientes mas costumam ter fase não-linear (atraso de grupo
    variável).
  xp: 12
  answers:
  - IIR
  - iir
