id: nt-online-stub
title: Loop online simulado
summary: Sliding window → bandpower toy → label → latency log (synth).
xp_reward: 40
unlock_xp: 0
owners:
- bci
phase: F9-fw
requires_rooms:
- nt-latency-budget
course: neurotech
resources:
- title: SPEC Neurotech
  url: https://github.com/edevPedro/edge-mage/blob/main/docs/SPEC-neurotech-course.md
  kind: docs
- title: OpenBCI Cyton
  url: https://docs.openbci.com/GettingStarted/Boards/CytonGS/
  kind: docs
- title: Blankertz et al. — The Berlin Brain-Computer Interface (Frontiers OA, PMC5116473)
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5116473/
  kind: paper
animation: closed_loop_timeline
emulator: online_loop
tasks:
- id: window
  type: mcq
  prompt: 'No stub online, a unidade típica de decisão é:'
  xp: 10
  answer: 1
  choices:
  - o dataset inteiro de uma vez
  - uma janela deslizante com orçamento de tempo
  - só o PDF do paper
  - o launcher
- id: win-ms
  type: numeric
  prompt: Em fs = 250 Hz, uma janela de 25 amostras dura quantos ms? (só window_ms)
  xp: 12
  answer: 100
  tolerance: 0.01
- id: log
  type: mcq
  prompt: 'O artefato do ritual online deve incluir:'
  xp: 10
  answer: 0
  choices:
  - latency_ms / misses / o que foi reproduzido
  - senha do hospital
  - receita de implante DIY
  - exploits
- id: ritual
  type: ritual
  prompt: 'Crie study-log/artifacts/neuro-online-loop.md (template do ritual) e valide.

    '
  xp: 20
  ritual_id: neuro-online-loop
- id: e2e
  type: fill
  prompt: No stub online deste curso, a sequência é window → bandpower toy → ___ → log de latência.
  xp: 10
  answers:
  - label
  - rótulo
  - rotulo
  - classe
- id: code-sliding-coords
  type: code
  prompt: Implemente `sliding_windows(total_samples, win_len=250, hop=50)` retornando lista de tuplas `(start, end)`.
  xp: 14
  code_template: "def sliding_windows(total_samples, win_len=250, hop=50):\n    ...\n"
  code_tests: '

    w = mod.sliding_windows(350, 250, 50)

    assert w == [(0, 250), (50, 300), (100, 350)]

    '
order: 58
