tasks:
- id: pipeline
  type: mcq
  prompt: 'A ordem típica do decode MVP offline neste curso é:'
  xp: 10
  answer: 0
  choices:
  - rótulos/trials → features (bandpower/cov) → classificador → métrica (κ)
  - κ → implantar → depois filtrar
  - só UART sem features
  - treino no teste e chamar de online
- id: lda-role
  type: mcq
  prompt: 'LDA (toy) neste lab serve para:'
  xp: 10
  answer: 1
  choices:
  - resolver FEM do crânio
  - separar classes em um espaço de features linear simples
  - substituir consentimento
  - aumentar fs além de Nyquist
- id: kappa-mvp
  type: numeric
  prompt: 'Em 2 classes equilibradas, acerto ao acaso p_e = 0.5.

    Se acurácia observada p_o = 0.75, κ = (p_o − p_e)/(1 − p_e) = ?

    '
  xp: 14
  answer: 0.5
  tolerance: 0.01
- id: lda-code
  type: code
  prompt: 'Implemente `predict_lda(x, w, b)` retornando 0 se w·x + b < 0, senão 1.

    `x` e `w` são listas do mesmo comprimento; `b` é float.

    '
  xp: 16
  code_template: "def predict_lda(x, w, b):\n    # TODO\n    ...\n"
  code_tests: 'assert mod.predict_lda([1.0, 0.0], [1.0, 0.0], -0.5) == 1

    assert mod.predict_lda([0.0, 1.0], [1.0, 0.0], -0.5) == 0

    assert mod.predict_lda([0.2, 0.2], [1.0, 1.0], -0.5) == 0

    '
- id: fit-kappa
  type: code
  prompt: 'Complete o MVP claim↔tasks: fit 1D + κ (sem sklearn no sandbox).


    `fit_threshold_lda(class0, class1)` — listas de floats (feature 1D por trial).

    Retorne `(w, b)` com `w = 1.0` e `b = -(mean0 + mean1) / 2`

    (hiperplano equidistante das médias; prediz classe 1 se `w*x + b >= 0`).


    `cohen_kappa(y_true, y_pred)` — listas iguais de 0/1.

    κ = (p_o − p_e) / (1 − p_e) com p_e pelas margens:

    p_e = p0_true*p0_pred + p1_true*p1_pred.

    Se 1 − p_e == 0, retorne 0.0.

    '
  xp: 18
  code_template: "def fit_threshold_lda(class0, class1):\n    # TODO\n    ...\n\ndef cohen_kappa(y_true, y_pred):\n    # TODO\n    ...\n"
  code_tests: 'w, b = mod.fit_threshold_lda([0.0, 0.2], [0.8, 1.0])

    assert abs(w - 1.0) < 1e-9

    assert abs(b - (-0.5)) < 1e-9

    assert abs(mod.cohen_kappa([0, 0, 1, 1], [0, 1, 1, 1]) - 0.5) < 1e-9

    assert abs(mod.cohen_kappa([0, 1], [0, 1]) - 1.0) < 1e-9

    assert abs(mod.cohen_kappa([0, 0, 0, 0], [0, 0, 0, 0])) < 1e-9

    '
- id: multivariate-regularized-lda
  type: code
  prompt: Implemente `fit_regularized_lda_2d(X_train, y_train, shrinkage=0.1)` decodificando ensaios multicanais de Imagética Motora (C3 e C4) do BCI Competition IV. O algoritmo deve calcular as médias de classe mu0, mu1, a dispersão intrabloco Sw, aplicar regularização de shrinkage Sigma_reg = (1-g)*Sigma + g*(trace/2)*I, inverter a matriz e extrair o hiperplano ótimo (w, b).
  xp: 20
  code_template: "def fit_regularized_lda_2d(X_train, y_train, shrinkage=0.1):\n    # X_train: lista de [c3_mu_power, c4_mu_power]\n    # y_train: lista de 0 ou 1\n    # retorne (w, b) onde w é lista [w0, w1] e b é float\n    ...\n"
  code_tests: "\nimport math\nX_tr = [\n    [10.0, 2.0], [9.5, 2.5], [11.0, 1.8], [8.5, 3.0],\n    [2.0, 10.0], [2.5, 9.0], [1.8, 11.2], [3.1, 8.8]\n]\ny_tr = [0, 0, 0, 0, 1, 1, 1, 1]\nw, b = mod.fit_regularized_lda_2d(X_tr, y_tr, shrinkage=0.1)\nassert len(w) == 2\n# Test trials:\n# Left hand (C3 high, C4 low) -> class 0\np0 = 1 if (10.5*w[0] + 2.1*w[1] + b >= 0) else 0\nassert p0 == 0\n# Right hand (C3 low, C4 high) -> class 1\np1 = 1 if (2.2*w[0] + 9.8*w[1] + b >= 0) else 0\nassert p1 == 1\n"
