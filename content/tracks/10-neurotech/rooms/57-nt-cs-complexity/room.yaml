  xp: 12
  code_template: "def within_deadline(n_channels, n_samples, us_per_sample=0.5, deadline_us=1000.0):\n\
    \    ...\n"
  code_tests: '

    assert mod.within_deadline(8, 200, 0.5, 1000.0) is True

    assert mod.within_deadline(64, 500, 0.5, 1000.0) is False

    '
