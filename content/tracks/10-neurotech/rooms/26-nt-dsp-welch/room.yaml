animation: filter_freq_response
tasks:
- id: df
  type: mcq
  prompt: 'Resolução em frequência aproximada de um segmento de duração T é:'
  xp: 12
  answer: 0
  choices:
  - Δf ≈ 1/T
  - Δf ≈ T
  - Δf ≈ fs sempre
  - Δf ≈ κ
- id: welch
  type: mcq
  prompt: 'Welch reduz variância do espectro principalmente por:'
  xp: 12
  answer: 1
  choices:
  - aumentar a taxa de amostragem magicamente
  - média de periodogramas de segmentos (com overlap típico)
  - remover consentimento
  - substituir o filtro analógico
- id: df-num
  type: numeric
  prompt: Segmento T=2.0 s. Δf ≈ 1/T = ? Hz
  xp: 14
  answer: 0.5
  tolerance: 0.01
- id: code-welch-avg
  type: code
  prompt: Implemente `welch_average(spectra)` calculando o espectro médio a partir de uma lista de espectros de potência (cada um lista de floats).
  xp: 14
  code_template: "def welch_average(spectra):\n    ...\n"
  code_tests: '

    s1 = [1.0, 2.0, 3.0]

    s2 = [3.0, 4.0, 5.0]

    res = mod.welch_average([s1, s2])

    assert abs(res[0] - 2.0) < 1e-5 and abs(res[1] - 3.0) < 1e-5

    '
