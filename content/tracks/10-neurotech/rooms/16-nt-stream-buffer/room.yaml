id: nt-stream-buffer
title: "Stream sintético e ring buffer"
summary: "Chunks online + buffer circular — lab testável."
xp_reward: 36
unlock_xp: 0
owners:
  - bci
  - eletrica
phase: F5
requires_rooms:
  - nt-metrics-offline
course: neurotech
resources:
  - title: "OpenBCI Cyton stream context"
    url: "https://docs.openbci.com/GettingStarted/Boards/CytonGS/"
    kind: docs
animation: sampling_dots
emulator: synth_eeg_stream
tasks:
  - id: why-ring
    type: mcq
    prompt: "Ring buffer em stream EEG serve para:"
    xp: 10
    answer: 0
    choices:
      - "manter janela recente com memória fixa"
      - "armazenar papers PDF"
      - "treinar LLM"
      - "substituir terra"
  - id: online
    type: mcq
    prompt: "Modo online simulado difere do offline porque:"
    xp: 10
    answer: 2
    choices:
      - "não usa amostragem"
      - "exige implante"
      - "processa em chunks/janelas com tempo"
      - "ignora Nyquist"
  - id: ring-code
    type: code
    prompt: |
      Implemente classe RingBuffer com push e latest(n). Capacidade fixa; latest devolve até n amostras mais recentes (ordem antiga→nova).
    xp: 18
    code_template: |
      class RingBuffer:
          def __init__(self, capacity):
              # TODO
              ...
          def push(self, x):
              ...
          def latest(self, n):
              ...
    code_tests: |
      b=mod.RingBuffer(3)
      for i in range(5):
          b.push(i)
      assert b.latest(3)==[2,3,4]
      assert b.latest(10)==[2,3,4]

