id: isa-x86-aarch64
title: Other ISAs at a glance (x86_64 vs AArch64)
summary: Literacy compare — same C, two dialects; why edge ≠ desktop. Deep path stays AArch64.
xp_reward: 30
unlock_xp: 20
shared: true
course: fundamentals
resources:
  - title: Compiler Explorer (Godbolt)
    url: https://godbolt.org/
    kind: tool
  - title: x86-64 psABI (System V AMD64 — living source)
    url: https://gitlab.com/x86-psABIs/x86-64-ABI
    kind: docs
  - title: Intel® 64 and IA-32 Architectures Software Developer Manuals (SDM)
    url: https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html
    kind: docs
  - title: AAPCS64 — Procedure Call Standard (abi-aa source)
    url: https://github.com/ARM-software/abi-aa/blob/main/aapcs64/aapcs64.rst
    kind: docs
  - title: Arm — Learn the architecture · A64 overview
    url: https://developer.arm.com/documentation/102374/0101/Overview
    kind: docs
  - title: Arm Architecture Reference Manual for A-profile (DDI0487)
    url: https://developer.arm.com/documentation/ddi0487/latest
    kind: docs
tasks:
  - id: same-c
    type: mcq
    prompt: "Compiling the same `add(a,b)` on Godbolt for x86_64 vs AArch64…"
    xp: 10
    answer: 2
    choices:
      - "must produce identical opcodes"
      - "is illegal — C only targets one ISA forever"
      - "produces different asm dialects that still implement the same function"
      - "deletes the return value on AArch64"
  - id: ret-reg-hint
    type: mcq
    prompt: "A common teaching pair for integer return registers is…"
    xp: 12
    answer: 0
    choices:
      - "x86_64: rax · AArch64: w0/x0 (width depends on type)"
      - "both always use r1 only"
      - "both return only via the stack, never registers"
      - "AArch64 returns in the instruction pointer"
  - id: edge-vs-desktop
    type: mcq
    prompt: "Edge / BCI targets often differ from a desktop x86_64 CPU mainly because…"
    xp: 10
    answer: 1
    choices:
      - "they use identical power budgets and always run the same SysV ABI forever"
      - "power, area, and thermal limits push fixed-point / NEON / MCU kernels — not desktop OoO scale"
      - "AArch64 forbids registers and forces all math through disk"
      - "Intel SDM replaces AAPCS64 on every phone"
  - id: which-deep
    type: fill
    prompt: "In e-mage the ISA you go deep on for edge/BCI is ___ (AArch64)."
    xp: 10
    answers:
      - "AArch64"
      - "aarch64"
      - "ARM64"
      - "arm64"
      - "A64"
  - id: outside-two-targets
    type: fill
    prompt: >-
      Outside lab: on Godbolt compile the same add() once as x86_64 and once as
      aarch64/armv8. Type ok when you spotted different register names.
    xp: 12
    answers:
      - "ok"
      - "OK"
      - "Ok"
