id: intro-asm
title: Intro assembly (shared core)
summary: Registers, mov, call/ret — ARM-leaning intro; then glance room isa-x86-aarch64; optional riscv-lite.
xp_reward: 28
unlock_xp: 0
shared: true
course: fundamentals
resources:
  - title: Compiler Explorer (Godbolt)
    url: https://godbolt.org/
    kind: tool
  - title: Arm — Learn the architecture · A64 overview
    url: https://developer.arm.com/documentation/102374/0101/Overview
    kind: docs
  - title: AAPCS64 (abi-aa)
    url: https://github.com/ARM-software/abi-aa/blob/main/aapcs64/aapcs64.rst
    kind: docs
  - title: Arm Architecture Reference Manual for A-profile (DDI0487)
    url: https://developer.arm.com/documentation/ddi0487/latest
    kind: docs
  - title: x86-64 psABI (System V AMD64) — literacy
    url: https://gitlab.com/x86-psABIs/x86-64-ABI
    kind: docs
  - title: llc CommandGuide
    url: https://llvm.org/docs/CommandGuide/llc.html
    kind: docs
  - title: LLVM LangRef (IR vs asm intuition)
    url: https://llvm.org/docs/LangRef.html
    kind: docs
tasks:
  - id: mov-role
    type: mcq
    prompt: "In typical asm, `mov dst, src` primarily…"
    xp: 10
    answer: 0
    choices:
      - "copies a value into a register or memory"
      - "multiplies two registers"
      - "jumps to a label"
      - "halts the CPU"
  - id: why-asm
    type: fill
    prompt: "Compilers lower high-level code toward ___ (or machine code)."
    xp: 10
    answers:
      - "assembly"
      - "asm"
      - "Assembly"
  - id: call-ret
    type: mcq
    prompt: "A typical function returns by…"
    xp: 12
    answer: 1
    choices:
      - "deleting the binary"
      - "ret (or equivalent) after placing the result in the ABI return register"
      - "only printing to stdout"
      - "renaming the file"
  - id: deep-isa
    type: fill
    prompt: "In e-mage Edge/BCI the ISA you go deep on is ___ (AArch64)."
    xp: 10
    answers:
      - "AArch64"
      - "aarch64"
      - "ARM64"
      - "arm64"
      - "A64"
  - id: outside-godbolt
    type: fill
    prompt: >-
      Outside lab: on godbolt.org compile `int add(int a,int b){return a+b;}`
      Prefer aarch64 if available; else note your host. Type aarch64 or x86_64.
    xp: 14
    answers:
      - "aarch64"
      - "arm64"
      - "AArch64"
      - "x86_64"
      - "x86-64"
      - "amd64"
