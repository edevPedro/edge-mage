id: intro-asm
title: Intro assembly (shared core)
summary: Registers, mov, call/ret — then bridge `isa-x86-aarch64`; optional `riscv-lite`.
xp_reward: 28
unlock_xp: 0
shared: true
course: fundamentals
resources:
  - title: Compiler Explorer (Godbolt)
    url: https://godbolt.org/
    kind: tool
  - title: Arm — Learn the architecture · A64 overview
    url: https://developer.arm.com/documentation/102374/0101/Overview
    kind: docs
  - title: x86-64 machine-level programming (CMU excerpt PDF)
    url: https://www.cs.cmu.edu/~fp/courses/15213-s07/lectures/machine.pdf
    kind: docs
  - title: LLVM LangRef (IR vs asm intuition)
    url: https://llvm.org/docs/LangRef.html
    kind: docs
tasks:
  - id: mov-role
    type: mcq
    prompt: "In typical asm, `mov dst, src` primarily…"
    xp: 10
    answer: 0
    choices:
      - "copies a value into a register or memory"
      - "multiplies two registers"
      - "jumps to a label"
      - "halts the CPU"
  - id: why-asm
    type: fill
    prompt: "Compilers lower high-level code toward ___ (or machine code)."
    xp: 10
    answers:
      - "assembly"
      - "asm"
      - "Assembly"
  - id: call-ret
    type: mcq
    prompt: "A typical function returns by…"
    xp: 12
    answer: 1
    choices:
      - "deleting the binary"
      - "ret (or equivalent) after placing the result in the ABI return register"
      - "only printing to stdout"
      - "renaming the file"
  - id: outside-godbolt
    type: fill
    prompt: >-
      Outside lab: on godbolt.org compile `int add(int a,int b){return a+b;}`
      and name the host ISA family you saw (x86_64 or aarch64).
    xp: 14
    answers:
      - "x86_64"
      - "x86-64"
      - "amd64"
      - "aarch64"
      - "arm64"
      - "AArch64"
